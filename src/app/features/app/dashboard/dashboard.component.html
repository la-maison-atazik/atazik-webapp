<div class="page-header">
	<h2>
		<i class="title-icon pi pi-ticket"></i>
		Adhérents et responsables légaux
	</h2>
	<p>
		Cette page vous permet de gérer les adhérents de l'association. Vous pouvez gérer les invitations par élève ainsi
		que leurs informations légaux et de paiements.
	</p>
</div>

<p-toolbar>
	<ng-template #start>
		<p-iconfield class="research-bar">
			<p-inputicon class="pi pi-search"/>
			<input pInputText type="text"
						 placeholder="Rechercher un nom ou un e-mail"/>
		</p-iconfield>
	</ng-template>

	<ng-template #end>
		<p-button icon="pi pi-refresh" class="margin-2" text severity="secondary"/>
		<p-button pRipple icon="pi pi-plus" label="Nouvelle inscription" (onClick)="goToNewRegistration()"/>
	</ng-template>
</p-toolbar>

<p-card>
	<p-tabs value="0">
		<p-tablist>
			<p-tab value="0">Adhérents</p-tab>
			<p-tab value="1">Responsables légaux</p-tab>
		</p-tablist>
		<p-tabpanels>
			<p-tabpanel value="0">
				<app-student-table/>
			</p-tabpanel>

			<p-tabpanel value="1">
				<app-responsible-table/>
			</p-tabpanel>
		</p-tabpanels>
	</p-tabs>
</p-card>
