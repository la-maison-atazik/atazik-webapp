<div class="page-header">
  <h2>
    <i class="title-icon pi pi-ticket"></i>
    Élèves
  </h2>
  <p>
    Cette page vous permet de gérer les élèves de l'association. Vous pouvez gérer leurs informations et leur adhérent
    lié.
  </p>
</div>

<p-toolbar>
  <ng-template #start>
    <p-iconfield class="research-bar">
      <p-inputicon class="pi pi-search"/>
      <input pInputText type="text"
             placeholder="Rechercher un nom ou autre"/>
    </p-iconfield>
  </ng-template>

  <ng-template #end>
    <p-button icon="pi pi-refresh" class="margin-2" text severity="secondary"/>
    <p-button pRipple icon="pi pi-plus" label="Nouvelle inscription" (onClick)="goToNewRegistration()"/>
  </ng-template>
</p-toolbar>

<p-card>
  <p-table
    #tableStudent
    stripedRows
    [value]="data"
    [scrollable]="true"
    [loading]="loading"
    selectionMode="single" [(selection)]="selectedRow" dataKey="uid"
    (onRowSelect)="onRowSelect($event)"
    (onRowUnselect)="onRowUnselect($event)"
  >
    <ng-template #header>
      <tr>
        <th>Nom</th>
        <th>Age</th>
        <th class="action-header-cell"></th>
      </tr>
    </ng-template>

    <ng-template #body let-student>
      <tr [pSelectableRow]="student">
        <td>
          <div class="name-table-container">
            <span class="display-name-text">{{ student.displayName }}</span>
          </div>
        </td>
        <td>
          <span>{{ student.age }} ans</span>
        </td>
        <td class="action-cell">
          <p-button
            icon="pi pi-arrow-right"
            pRipple
            text
            (click)="viewStudent(student)"
            [disabled]="loading"
          ></p-button>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="8" class="empty-table-msg">Aucun élève trouvé.<br>La recherche est invalide ou une erreur
          s'est produite.
        </td>
      </tr>
    </ng-template>
  </p-table>

</p-card>
