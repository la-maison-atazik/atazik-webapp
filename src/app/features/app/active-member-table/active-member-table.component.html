<div class="page-header">
  <h2>
    <i class="title-icon pi pi-ticket"></i>
    Adhérents actifs
  </h2>
  <p>
    Cette page vous permet de gérer les adhérents actifs de l'association. Vous pouvez gérer leurs informations liées et
    leurs paiements.
  </p>
</div>

<p-toolbar>
  <ng-template #start>
    <p-iconfield class="research-bar">
      <p-inputicon class="pi pi-search"/>
      <input pInputText type="text"
             placeholder="Rechercher un nom ou un e-mail"/>
    </p-iconfield>
  </ng-template>

  <ng-template #end>
    <p-button icon="pi pi-refresh" class="margin-2" text severity="secondary"/>
    <p-button pRipple icon="pi pi-plus" label="Nouvelle inscription" (onClick)="goToNewRegistration()"/>
  </ng-template>
</p-toolbar>

<p-card>
</p-card>
